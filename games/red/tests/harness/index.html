<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Red harness</title>
<link rel="stylesheet" href="../../bga/red.css">
<style>
  body { margin: 0; font-family: sans-serif; background: #fff; }
  #game_play_area { padding: 0; }
  #out { white-space: pre-wrap; font: 12px monospace; padding: 8px; }
</style>
</head>
<body data-done="0">
<div id="page-content">
  <div id="statusbar"></div>
  <div id="game_play_area"></div>
</div>
<div id="player_panels"></div>
<pre id="out">running</pre>

<script>
window._ = (s) => s;
window.g_gamethemeurl = '../../bga/';
window.errors = [];
window.addEventListener('error', (e) => window.errors.push(String(e.message)));
window.addEventListener('unhandledrejection', (e) => window.errors.push(String(e.reason)));
</script>
<script type="module">
import { Game } from '../../bga/modules/js/Game.js';

const calls = [];
const buttons = [];
let title = '';
const bga = {
  states: { register() {} },
  gameArea: { getElement: () => document.getElementById('game_play_area') },
  notifications: { setupPromiseNotifications() {} },
  userPreferences: { get: () => 1 },
  sounds: { play() {} },
  statusBar: {
    setTitle(text, args) {
      title = text;
      if (args) Object.keys(args).forEach((k) => { title = title.replace('${' + k + '}', args[k]); });
    },
    addActionButton(label, fn, opts) { buttons.push({ label, fn, opts: opts || {} }); },
    removeActionButtons() { buttons.length = 0; },
  },
  players: {
    getCurrentPlayerId: () => 1,
    isCurrentPlayerActive: () => true,
    getActivePlayerId: () => 1,
  },
  playerPanels: {
    getElement: (pid) => {
      let el = document.getElementById('panel_' + pid);
      if (!el) {
        el = document.createElement('div');
        el.id = 'panel_' + pid;
        document.getElementById('player_panels').appendChild(el);
      }
      return el;
    },
    getScoreCounter: () => ({ toValue() {} }),
  },
  actions: {
    performAction(name, args) { calls.push({ name, args }); return Promise.resolve(); },
  },
};

function fixture() {
  const pool = [
    { size: 1, bg: 'white', circle: 'black', count: 4 },
    { size: 1, bg: 'white', circle: 'red', count: 5 },
    { size: 1, bg: 'black', circle: 'white', count: 5 },
    { size: 1, bg: 'black', circle: 'red', count: 5 },
    { size: 1, bg: 'red', circle: 'white', count: 5 },
    { size: 1, bg: 'red', circle: 'black', count: 5 },
    { size: 2, bg: 'white', circle: 'black', count: 1 },
    { size: 2, bg: 'white', circle: 'red', count: 1 },
    { size: 2, bg: 'black', circle: 'white', count: 1 },
    { size: 2, bg: 'black', circle: 'red', count: 1 },
    { size: 2, bg: 'red', circle: 'white', count: 1 },
    { size: 2, bg: 'red', circle: 'black', count: 1 },
  ];
  const tiles = [
    { id: 1, player_id: 1, size: 1, bg: 'white', circle: 'black', x: 0, y: 0 },
  ];
  return {
    players: {
      1: { id: 1, name: 'Alice', color: 'f1ede3' },
      2: { id: 2, name: 'Bob', color: '1e1d1b' },
      3: { id: 3, name: 'Charlie', color: 'd6281e' },
    },
    tiles,
    pool,
    colours: { 1: 'white', 2: 'black', 3: 'red' },
    variant: false,
    last: 1,
  };
}

try {
  const game = new Game(bga);
  game.setup(fixture());

  // Enter turn state
  const turnArgs = {
    anchors: {
      '1_white_red': [[1, 0], [-1, 0], [0, 1], [0, -1]],
      '1_black_white': [[1, 0], [-1, 0], [0, 1], [0, -1]],
    },
    forbidden: null,
    variant: false,
  };
  game.enterTurn(turnArgs, true);

  setTimeout(() => {
    const board = document.querySelector('#red_board') || document.querySelector('#red_board_wrap');
    const boardRect = board ? board.getBoundingClientRect() : { width: 0, left: 0 };
    const vp = window.innerWidth;
    const horizontalOverflow = Math.max(0, document.documentElement.scrollWidth - vp);

    // Measure pool tiles
    const poolTiles = document.querySelectorAll('.red_pool_tile');
    let minPoolSize = 999;
    poolTiles.forEach(c => {
      const r = c.getBoundingClientRect();
      const s = Math.min(r.width, r.height);
      if (s > 0 && s < minPoolSize) minPoolSize = s;
    });

    const report = {
      viewport: vp,
      boardWidth: Math.round(boardRect.width),
      horizontalOverflow: Math.round(horizontalOverflow),
      poolTargetMin: minPoolSize === 999 ? 0 : Math.round(minPoolSize),
      jsErrors: window.errors,
      ok: window.errors.length === 0 && horizontalOverflow === 0,
    };

    document.getElementById('out').textContent = JSON.stringify(report, null, 2);
    document.body.dataset.done = '1';
  }, 200);

} catch (err) {
  window.errors.push(err.stack || err.message);
  document.getElementById('out').textContent = JSON.stringify({ ok: false, error: String(err) }, null, 2);
  document.body.dataset.done = '1';
}
</script>
</body>
</html>
