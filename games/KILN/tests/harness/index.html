<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KILN harness</title>
<link rel="stylesheet" href="../../bga/kiln.css">
<style>
  body { margin: 0; font-family: sans-serif; background: #fff; }
  #game_play_area { padding: 0; }
  #out { white-space: pre-wrap; font: 12px monospace; padding: 8px; }
</style>
</head>
<body data-done="0">
<div id="page-content">
  <div id="statusbar"></div>
  <div id="game_play_area"></div>
</div>
<div id="player_panels"></div>
<pre id="out">running</pre>

<script>
window._ = (s) => s;
window.g_gamethemeurl = '../../bga/';
window.errors = [];
window.addEventListener('error', (e) => {
  const msg = String(e.message || e);
  if (!msg.includes('ResizeObserver')) window.errors.push(msg);
});
window.addEventListener('unhandledrejection', (e) => {
  const msg = String(e.reason || e);
  if (!msg.includes('ResizeObserver')) window.errors.push(msg);
});
</script>
<script type="module">
import { Game } from '../../bga/modules/js/Game.js';

const calls = [];
const buttons = [];
let turnState = null;

const bga = {
  states: {
    register(name, handler) {
      if (name === 'PlayerTurn') turnState = handler;
    }
  },
  gameArea: { getElement: () => document.getElementById('game_play_area') },
  notifications: { setupPromiseNotifications() {} },
  userPreferences: { get: () => 1 },
  sounds: { play() {} },
  statusBar: {
    setTitle() {},
    addActionButton(text, callback, opts) {
      buttons.push({ text, callback, opts: opts || {} });
    },
    removeActionButtons() { buttons.length = 0; },
  },
  players: {
    getCurrentPlayerId: () => 1,
    isCurrentPlayerActive: () => true,
    getActivePlayerId: () => 1,
  },
  playerPanels: {
    getElement: (pid) => {
      let el = document.getElementById('panel_' + pid);
      if (!el) {
        el = document.createElement('div');
        el.id = 'panel_' + pid;
        document.getElementById('player_panels').appendChild(el);
      }
      return el;
    },
    getScoreCounter: () => ({ toValue() {} }),
  },
  actions: {
    performAction(name, args) { calls.push({ name, args }); return Promise.resolve(); },
  },
};

function fixture() {
  const colors = ['red', 'blue', 'yellow', 'white', 'black'];
  const board = [];
  for (let r = 0; r < 5; r++) {
    const row = [];
    for (let c = 0; c < 5; c++) {
      row.push(colors[(r + c) % 5]);
    }
    board.push(row);
  }

  return {
    players: {
      1: { id: 1, name: 'Alice', color: 'c0392b', score: 0 },
      2: { id: 2, name: 'Bob', color: '2980b9', score: 0 },
    },
    scores: { 1: 0, 2: 0 },
    board,
    outer_tile: { border_slot: 0, color: 'black' },
    warehouses: {
      1: Array(5).fill(0).map(() => Array(5).fill(null)),
      2: Array(5).fill(0).map(() => Array(5).fill(null)),
    },
    player_colors: { 1: 'c0392b', 2: '2980b9' },
    player_seats: { 1: 0, 2: 2 },
    target_score: 17,
    variant_bonus_spaces: 0,
    variant_fixing_mess: 0,
  };
}

try {
  const game = new Game(bga);
  game.setup(fixture());

  if (turnState) {
    turnState.onEnteringState({ valid_slots: [0, 1, 2, 3, 4] }, true);
  }

  setTimeout(() => {
    const board = document.getElementById('kiln_main_container') || document.getElementById('kiln_board');
    const boardRect = board ? board.getBoundingClientRect() : { width: 0 };
    const vp = window.innerWidth;
    const horizontalOverflow = Math.max(0, document.documentElement.scrollWidth - vp);

    // Measure cell tap target size
    let minCell = 999;
    document.querySelectorAll('.kiln_cell, .kiln_arrow_slot').forEach(c => {
      const r = c.getBoundingClientRect();
      const s = Math.min(r.width, r.height);
      if (s > 0 && s < minCell) minCell = s;
    });

    const report = {
      viewport: vp,
      boardWidth: Math.round(boardRect.width),
      horizontalOverflow: Math.round(horizontalOverflow),
      cellTargetMin: minCell === 999 ? 0 : Math.round(minCell),
      jsErrors: window.errors,
      ok: window.errors.length === 0 && horizontalOverflow === 0,
    };

    document.getElementById('out').textContent = JSON.stringify(report, null, 2);
    document.body.dataset.done = '1';
  }, 350);

} catch (err) {
  window.errors.push(err.stack || err.message);
  document.getElementById('out').textContent = JSON.stringify({ ok: false, error: String(err.stack || err) }, null, 2);
  document.body.dataset.done = '1';
}
</script>
</body>
</html>
