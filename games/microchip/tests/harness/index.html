<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Microchip harness</title>
<link rel="stylesheet" href="../../bga/microchip.css">
<style>
  /* the harness page itself: a plain background, the game inside the body like BGA's game area */
  body { margin: 0; font-family: sans-serif; }
  #game_play_area { padding: 0; }
  #out { white-space: pre; font: 12px monospace; padding: 8px; }
</style>
</head>
<body class="microc_cb_on" data-done="0">
<div id="page-content">
  <div id="game_play_area"></div>
  <div id="panel_1" class="player-panel"></div>
  <div id="panel_2" class="player-panel"></div>
  <div id="panel_3" class="player-panel"></div>
</div>
<pre id="out">running</pre>

<script>
// Mock of the BGA framework pieces the client uses. Records calls so the checks can read them.
window._ = (s) => s;
const calls = [];
const buttons = [];
const scores = {};
let title = '';
const bga = {
  states: { register() {} },
  gameArea: { getElement: () => document.getElementById('game_play_area') },
  notifications: { setupPromiseNotifications() {} },
  statusBar: {
    setTitle(text, args) {
      title = text;
      if (args) Object.keys(args).forEach((k) => { title = title.replace('${' + k + '}', args[k]); });
    },
    addActionButton(label, fn, opts) { buttons.push({ label, fn, opts: opts || {} }); },
    removeActionButtons() { buttons.length = 0; },
  },
  players: { getCurrentPlayerId: () => 1 },
  playerPanels: {
    getElement: (pid) => document.getElementById('panel_' + pid) || null,
    getScoreCounter: (pid) => ({
      toValue(val) { scores[pid] = val; }
    }),
  },
  actions: {
    performAction(name, args) { calls.push({ name, args }); return Promise.resolve(); },
  },
};

const COLOURS = ['blue', 'red', 'green', 'yellow', 'pink'];
const SET = ['plus', 'tee', 'tee', 'tee', 'corner', 'corner', 'straight', 'straight', 'end', 'end', 'end', 'end'];
const params = new URLSearchParams(location.search);
const mode = params.get('mode') || 'turn';
// clean=1 hides the report, for the Control Panel screenshots; zoom=0.7 shrinks the whole page
if (params.get('clean')) { document.getElementById('out').style.display = 'none'; document.body.style.overflow = 'hidden'; }
if (params.get('zoom')) document.body.style.zoom = params.get('zoom');

// A fixed fixture: 3 players, pool 5 x 12, my tray and board filled in a little
function fixture() {
  const tiles = [];
  for (let id = 0; id < 60; id++) {
    tiles.push({ id, colour: COLOURS[Math.floor(id / 12)], shape: SET[id % 12], location: 'pool', owner: 0, col: null, row: null, r: null, c: null, rot: 0 });
  }
  // Pool: column-major from the right (col 11 is the draw column)
  const poolIds = mode === 'build' ? [] : [...Array(40).keys(), ...Array.from({ length: 14 }, (_, i) => 45 + i)];
  poolIds.forEach((id, k) => { tiles[id].location = 'pool'; tiles[id].col = 11 - Math.floor(k / 5); tiles[id].row = k % 5; });
  if (mode === 'build') tiles.forEach((t) => { if (t.id < 40) t.location = 'box'; });
  const hand = [40, 41, 42];
  hand.forEach((id) => { tiles[id].location = 'hand'; tiles[id].owner = 1; });
  tiles[59].location = 'hand'; tiles[59].owner = 2; tiles[59].colour = 'yellow'; tiles[59].shape = 'end';
  // Tiles not used by this fixture are in the box
  if (mode === 'build') for (let id = 45; id < 60; id++) tiles[id].location = 'box';
  // Board of player 1: two tiles placed
  tiles[43].location = 'board'; tiles[43].owner = 1; tiles[43].r = 0; tiles[43].c = 0; tiles[43].shape = 'end'; tiles[43].colour = 'blue'; tiles[43].rot = 1;
  tiles[44].location = 'board'; tiles[44].owner = 1; tiles[44].r = 1; tiles[44].c = 4; tiles[44].shape = 'end'; tiles[44].colour = 'red'; tiles[44].rot = 3;
  // Tray tiles: blue end, red tee, green straight (ids 40, 41, 42 are colour blue/red/green by id)
  tiles[40].colour = 'blue'; tiles[40].shape = 'end';
  tiles[41].colour = 'red'; tiles[41].shape = 'tee';
  tiles[42].colour = 'green'; tiles[42].shape = 'straight';
  const spaces = {};
  for (const pid of [1, 2, 3]) {
    spaces[pid] = [];
    for (let r = 0; r < 5; r++) {
      spaces[pid][r] = [];
      for (let c = 0; c < 5; c++) spaces[pid][r][c] = COLOURS[(2 * r + c) % 5];
    }
  }
  return {
    players: { 1: { name: 'Ana' }, 2: { name: 'Ben' }, 3: { name: 'Cy' } },
    player_order: [1, 2, 3],
    tiles,
    spaces,
    finished: { 1: false, 2: false, 3: false },
    drawer: mode === 'build' ? 0 : 1,
    rotation: true,
    pool_size: [5, 12],
  };
}

const results = [];
function check(ok, what) { results.push({ ok: !!ok, what }); }

async function run() {
  const { Game } = await import('../../bga/modules/js/Game.js');
  const gd = fixture();
  const game = new Game(bga);
  window.game = game;
  game.amActive = true;
  game.setup(gd);
  game.amActive = true;
  game.refreshButtons();

  const root = document.getElementById('microc_root');
  const press = (label) => {
    const b = buttons.find((x) => x.label === label);
    if (!b) return false;
    if (b.opts.disabled) return 'disabled';
    b.fn();
    return true;
  };
  const labels = () => buttons.map((b) => b.label + (b.opts.disabled ? '(off)' : ''));

  // 1. Layout at this width
  const doc = document.documentElement;
  check(doc.scrollWidth <= window.innerWidth, `no horizontal page scroll (scrollWidth ${doc.scrollWidth}, width ${window.innerWidth})`);
  const canBtns = [...root.querySelectorAll('.mc_tile_btn.mc_can')];
  const tapSizes = canBtns.map((b) => Math.min(b.getBoundingClientRect().width, b.getBoundingClientRect().height));
  const minTap = tapSizes.length ? Math.min(...tapSizes) : 0;
  const drawCount = mode === 'turn' ? 5 : 0;
  if (drawCount) {
    check(minTap >= 32, `draw-column tiles at least 32px (${minTap.toFixed(1)}px)`);
    const drawArrow = root.querySelector('.mc_draw_arrow');
    check(drawArrow && drawArrow.querySelector('.mc_draw_arrow_svg'), 'red arrow present above draw column');
  }
  const boardSpaces = [...root.querySelectorAll('#mc_board_me .mc_space')];
  const spaceMin = Math.min(...boardSpaces.map((b) => Math.min(b.getBoundingClientRect().width, b.getBoundingClientRect().height)));
  check(boardSpaces.length === 25 && spaceMin >= 32, `board spaces at least 32px (${spaceMin.toFixed(1)}px)`);
  const trayBtns = [...root.querySelectorAll('.mc_tray .mc_tile_btn')];
  const trayCount = 3;
  check(trayBtns.length === trayCount, `tray tiles: ${trayBtns.length}, expected ${trayCount}`);
  const traySizes = trayBtns.map((b) => Math.min(b.getBoundingClientRect().width, b.getBoundingClientRect().height));
  check(traySizes.every((s) => s >= 32), `tray tiles at least 32px (${traySizes.map((s) => s.toFixed(0)).join(',')})`);

  // Opponent boards and tray tiles in panels, and live scores
  check(!document.querySelector('#panel_1 .mc_panel_board'), 'active player panel does not duplicate own board');
  const p2Board = document.querySelector('#panel_2 .mc_panel_board');
  const p3Board = document.querySelector('#panel_3 .mc_panel_board');
  check(p2Board && p2Board.querySelector('.mc_grid'), 'opponent 2 board rendered inside player panel');
  check(p3Board && p3Board.querySelector('.mc_grid'), 'opponent 3 board rendered inside player panel');
  const p2Tray = document.querySelector('#panel_2 .mc_panel_tray');
  check(p2Tray && p2Tray.querySelectorAll('.mc_panel_tile').length > 0, 'opponent 2 tray tiles rendered underneath their board');
  check(typeof scores[1] === 'number', `live score computed for player 1: ${scores[1]}`);

  if (mode === 'turn') {
    // 2. Draw: tap a draw-column tile -> sends actDraw immediately, and the drawn tile becomes selected
    root.querySelector('.mc_can').click();
    await Promise.resolve();
    const drawCall = calls[calls.length - 1];
    check(drawCall && drawCall.name === 'actDraw' && typeof drawCall.args.tileId === 'number', `actDraw sent immediately (${JSON.stringify(drawCall)})`);
    const id = drawCall.args.tileId;
    await game.notif_tileDrawn({ player_id: 1, tile: { id, colour: game.tiles.get(id).colour, shape: game.tiles.get(id).shape }, from: { col: 11, row: 0 }, next_drawer: 2, draw_column: 11, pool_left: 34 });
    check(root.querySelectorAll('.mc_tray .mc_tile_btn').length === 4, 'tray has four tiles after drawing');
    check(game.sel && game.sel.id === id && root.querySelector(`.mc_tray .mc_tile_btn.mc_sel[data-id="${id}"]`), 'drawn tile is selected (highlighted in the tray)');

    // 3. Placement. Tray tile 40 is a blue end. The free blue spaces are (1,3), (2,1), (3,4), (4,2)
    game.onTrayTile(40);
    check(game.sel.id === 40, 'tapping a tray tile selects it');
    check(root.querySelectorAll('#mc_board_me .mc_target').length === 4, `four free blue spaces are targets (${root.querySelectorAll('#mc_board_me .mc_target').length})`);
    const space = (r, c) => [...root.querySelectorAll('#mc_board_me .mc_space')].find((s) => +s.dataset.r === r && +s.dataset.c === c);
    const placedEl = (tid) => root.querySelector(`#mc_board_me .mc_placed[data-id="${tid}"]`);

    // A wrong colour space (no legal rotation): the tile is shown there anyway, marked invalid with a red !, not sent to the server
    const nBefore = calls.length;
    space(0, 2).click();
    check(calls.length === nBefore, 'a wrong-colour space sends nothing to the server');
    check(placedEl(40) && placedEl(40).classList.contains('mc_bad') && placedEl(40).querySelector('.mc_tile_err'), 'tile on a wrong-colour space is shown invalid with a red ! badge');
    check(placedEl(40).querySelector('.mc_tile_err').title === 'Invalid placement', 'invalid badge has the tooltip');
    check(game.sel && game.sel.id === 40, 'invalid tile stays selected');
    check(!labels().includes('Finish'), 'no Finish while the pool is not empty');

    // (2,1) is legal: actPlace sent, in a legal rotation, tile stays selected
    space(2, 1).click();
    await Promise.resolve();
    const place = calls[calls.length - 1];
    check(place.name === 'actPlace' && place.args.r === 2 && place.args.c === 1 && place.args.rot === 0 && place.args.tileId === 40, `actPlace sent immediately (${JSON.stringify(place)})`);
    game.notif_tilePlaced({ player_id: 1, tile: { id: 40, colour: 'blue', shape: 'end' }, r: 2, c: 1, rot: 0, moved: false, coord: 'B3' });
    check(game.sel && game.sel.id === 40 && game.sel.from === 'board', 'tile stays selected once the server accepts the placement');
    check(placedEl(40) && placedEl(40).classList.contains('mc_sel') && !placedEl(40).querySelector('.mc_tile_err'), 'placed tile is highlighted as selected and valid');
    check(root.querySelectorAll('#mc_board_me .mc_placed').length === 3, 'three tiles on my board after the placement');
    check(placedEl(40).querySelector('.mc_tile_open'), 'placed end with a connection to an empty cell shows the yellow open-connection badge');
    check(placedEl(40).querySelector('.mc_tile_open').title.startsWith('Open connection'), 'open badge has the tooltip');

    // Click the selected tile again: rotated to the next legal rotation
    placedEl(40).click();
    await Promise.resolve();
    const rot1 = calls[calls.length - 1];
    check(rot1.name === 'actPlace' && rot1.args.tileId === 40 && rot1.args.rot !== 0, `clicking the selected tile rotates it (${JSON.stringify(rot1)})`);
    game._actionPending = false;
    game.notif_tilePlaced({ player_id: 1, tile: { id: 40, colour: 'blue', shape: 'end' }, r: 2, c: 1, rot: rot1.args.rot, moved: true, coord: 'B3' });
    check(game.sel && game.sel.id === 40, 'tile still selected after rotating');

    // Click another empty blue cell: moves there (a legal rotation), still selected
    space(3, 4).click();
    await Promise.resolve();
    const mv = calls[calls.length - 1];
    check(mv.name === 'actPlace' && mv.args.r === 3 && mv.args.c === 4 && mv.args.rot === 0, `clicking an empty cell moves the selected tile with a legal rotation (${JSON.stringify(mv)})`);
    game._actionPending = false;
    game.notif_tilePlaced({ player_id: 1, tile: { id: 40, colour: 'blue', shape: 'end' }, r: 3, c: 4, rot: mv.args.rot, moved: true, coord: 'E4' });
    check(game.sel && game.sel.id === 40 && game.sel.r === 3, 'moved tile is still selected');

    // Clicking another tile selects it (the first one is deselected)
    placedEl(43).click();
    check(game.sel && game.sel.id === 43 && !placedEl(40).classList.contains('mc_sel') && placedEl(43).classList.contains('mc_sel'), 'clicking another tile selects it and deselects the first');

    // Clicking empty non-board space deselects; so does Escape
    root.querySelector('#mc_hint').click();
    check(game.sel === null, 'clicking empty space deselects');
    placedEl(43).click();
    window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
    check(game.sel === null, 'Escape deselects');

    // 4. Board tile buttons: Rotate and Remove
    placedEl(43).click();
    check(labels().includes('Remove') && labels().includes('Rotate'), `board tile buttons: ${labels()}`);
    press('Remove');
    await Promise.resolve();
    check(calls[calls.length - 1].name === 'actReturn', 'Remove sends actReturn');
    game._actionPending = false;
    game.notif_tileReturned({ player_id: 1, tile: { id: 43, colour: 'blue', shape: 'end' }, coord: 'A1' });
    game.onTrayTile(41);
    check(labels().includes('Deselect') && !labels().includes('Remove'), 'tray tile: no Remove');
    press('Deselect');
    check(game.sel === null, 'Deselect clears the selection');

    // 8. Rapid click guard: clicking pool tiles while an action is in flight does not send concurrent actions
    game.drawer = 1;
    game.tiles.forEach((t) => { if (t.location === 'pool') t.location = 'box'; });
    const poolT1 = game.tiles.get(50);
    const poolT2 = game.tiles.get(51);
    poolT1.location = 'pool'; poolT1.col = 0; poolT1.row = 0;
    poolT2.location = 'pool'; poolT2.col = 0; poolT2.row = 1;
    const callsBefore = calls.length;
    game.onPoolTile(50);
    game.onPoolTile(51);
    check(calls.length === callsBefore + 1 && calls[calls.length - 1].args.tileId === 50, 'rapid pool tile clicks are guarded against concurrent actDraw');
    game._actionPending = false;

    // 9. Replace: a selected tray tile + a same-colour board tile -> actSwap; different colour -> just selects
    game.tiles.forEach((t) => { if (t.owner === 1 && t.location === 'board') { t.location = 'hand'; t.r = null; t.c = null; t.rot = 0; } });
    Object.assign(game.tiles.get(44), { location: 'board', r: 1, c: 4, rot: 3, colour: 'red', shape: 'end' });
    Object.assign(game.tiles.get(40), { location: 'board', r: 3, c: 4, rot: 0, colour: 'blue', shape: 'end' });
    game.sel = null; game.ghost = null; game._actionPending = false;
    game.renderAll();
    game.onTrayTile(42); // green straight in the tray
    const nSw = calls.length;
    root.querySelector('#mc_board_me .mc_placed[data-id="40"]').click(); // blue board tile
    check(calls.length === nSw && game.sel && game.sel.id === 40, 'different colour: just selects the board tile');
    game.onTrayTile(41); // red tee in the tray
    root.querySelector('#mc_board_me .mc_placed[data-id="44"]').click();
    await Promise.resolve();
    const sw = calls[calls.length - 1];
    check(sw.name === 'actSwap' && sw.args.tileId === 41 && sw.args.targetTileId === 44 && sw.args.rot >= 0 && sw.args.rot < 4, `same colour: actSwap sent (${JSON.stringify(sw)})`);
    game.notif_tileSwapped({ player_id: 1, type: 'tray_board', tile_a: { id: 41, colour: 'red', shape: 'tee' }, tile_b: { id: 44, colour: 'red', shape: 'end' }, r: 1, c: 4, rot: sw.args.rot, coord: 'E2' });
    check(game.tiles.get(44).location === 'hand' && game.tiles.get(41).location === 'board' && game.tiles.get(41).r === 1 && game.tiles.get(41).c === 4, 'board tile went back to the tray, incoming tile placed');
    check(game.sel && game.sel.id === 41 && game.sel.from === 'board' && root.querySelector('#mc_board_me .mc_placed.mc_sel[data-id="41"]'), 'incoming tile stays selected');
    check(root.querySelector('.mc_tray .mc_tile_btn[data-id="44"]'), 'replaced tile shows in the tray');
  } else {
    // 6. Build: pool empty. Temporary mismatches show ! and block Finish
    const t44 = game.tiles.get(44);
    t44.r = 0; t44.c = 1; t44.rot = 2; // (0,1) faces south, mismatch with (0,0) facing east
    game.renderAll();
    const openCount = root.querySelectorAll('#mc_board_me .mc_tile_open').length;
    check(openCount === 2 && root.querySelectorAll('#mc_board_me .mc_tile_err').length === 0, `mismatched neighbours show yellow open badges, no red (${openCount})`);
    check(labels().includes('Finish') && !labels().includes('Finish(off)'), 'open connections do not block Finish');

    // An invalid placement (tray tile on a wrong-colour space) blocks Finish
    game.tiles.get(40).location = 'hand';
    game.onTrayTile(40);
    game.onSpace(0, 2);
    check(root.querySelectorAll('#mc_board_me .mc_tile_err').length === 1, 'invalid placement shows a red ! badge');
    check(labels().includes('Finish(off)'), 'invalid placement disables Finish');
    const callsBeforeFin = calls.length;
    game.doFinish();
    check(calls.length === callsBeforeFin, 'doFinish is blocked while an invalid placement exists');
    press('Remove');
    check(root.querySelectorAll('#mc_board_me .mc_tile_err').length === 0 && game.ghost === null, 'removing the invalid tile clears the badge');
    t44.rot = 3;
    game.renderAll();
    check(root.querySelectorAll('#mc_board_me .mc_tile_open').length === 0 && true, 'a closed pair shows no open badge');

    check(labels().includes('Finish'), `Finish offered when the pool is empty: ${labels()}`);
    press('Finish');
    const fin = calls[calls.length - 1];
    check(fin && fin.name === 'actFinish', 'Finish sends actFinish immediately');
    game.notif_playerFinished({ player_id: 1 });
    check(!labels().includes('Finish') && labels().includes('Resume building'), 'Resume building offered while waiting for other players');
    press('Resume building');
    const resCall = calls[calls.length - 1];
    check(resCall && resCall.name === 'actResume', `actResume sent (${JSON.stringify(resCall)})`);
    game.notif_playerResumed({ player_id: 1 });
    check(labels().includes('Finish'), 'Finish button returns after resuming');
    press('Finish');
    game.notif_playerFinished({ player_id: 1 });
    game.notif_finalScoring({
      rows: [
        { player_id: 1, score: 0, value: 2, chip_tiles: 2, unused: 1, owned: 3, chip: ['0,0', '0,1'] },
        { player_id: 2, score: -4, value: 0, chip_tiles: 0, unused: 2, owned: 2, chip: [] },
      ],
    });
    check(root.querySelector('#mc_pool_section').hidden, 'pool section is hidden when pool is empty');
    check(root.querySelector('#mc_results').hidden && root.querySelectorAll('#mc_results_modal tbody tr').length === 2, 'no table under the board; the popup lists both players');
    check(!root.querySelector('#mc_results_modal').hidden, 'results modal popup is shown after final scoring');
    check(!root.querySelector('#mc_scores_btn').hidden, 'scores button is visible after final scoring');
    const modalCard = root.querySelector('.mc_results_card');
    check(!root.querySelector('.mc_results_popup_table').textContent.includes('Calculation') && !root.querySelector('.mc_results_rules_note') && !root.querySelector('.mc_calc_cell'), 'score popup has no Calculation column and no explanation box');
    check(root.querySelectorAll('.mc_results_popup_table thead th').length === 4, 'score popup has four columns');
    check(modalCard.scrollWidth <= modalCard.clientWidth && modalCard.getBoundingClientRect().right <= window.innerWidth + 0.5 && doc.scrollWidth <= window.innerWidth, `score popup fits the width without horizontal overflow (card ${modalCard.scrollWidth}/${modalCard.clientWidth}, window ${window.innerWidth})`);
    check(root.querySelectorAll('.mc_res_winner').length === 1, 'winner row highlighted');
    root.querySelector('.mc_results_close_btn').click();
    check(root.querySelector('#mc_results_modal').hidden, 'results modal is hidden after clicking close');
    root.querySelector('#mc_scores_btn').click();
    check(!root.querySelector('#mc_results_modal').hidden, 'results modal is reopened after clicking scores button');
    root.querySelector('.mc_results_dismiss_btn').click();
    check(root.querySelector('#mc_results_modal').hidden, 'results modal is hidden after clicking dismiss button');
    check(root.querySelectorAll('#mc_board_me .mc_placed.mc_chip').length === 2, `the two chip tiles are highlighted (${root.querySelectorAll('#mc_board_me .mc_placed.mc_chip').length})`);
  }

  const blocksInfo = [...root.querySelectorAll('.mc_pool_grid')].map((b) => {
    const r = b.getBoundingClientRect();
    return { x: Math.round(r.x), y: Math.round(r.y), w: Math.round(r.width), h: Math.round(r.height), cells: b.children.length, cols: b.style.gridTemplateColumns };
  });
  const poolWrap = root.querySelector('#mc_pool').getBoundingClientRect();
  check(true, `pool wrap w=${Math.round(poolWrap.width)} blocks=${JSON.stringify(blocksInfo)}`);
  const failures = results.filter((r) => !r.ok);
  const report = { mode, width: window.innerWidth, checks: results.length, failures: failures.length, results };
  document.getElementById('out').textContent = JSON.stringify(report, null, 1);
  document.body.dataset.done = '1';
}

function tilesRot(id) {
  return window.game.tiles.get(id).rot;
}

run().catch((e) => {
  document.getElementById('out').textContent = 'ERROR ' + (e && e.stack ? e.stack : e);
  document.body.dataset.done = '1';
});
</script>
</body>
</html>
