<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>People frame</title>
<style>body{margin:0;background:#fff} iframe{border:0;display:block}</style>
</head>
<body>
<!-- Runs index.html inside iframes of the chosen width, so the page sees a real phone-width viewport.
     Headless Chrome will not shrink its own window below about 500px.
     Without ?players= it runs the 2, 3 and 4 player boards (cropped 5x5, cropped 5x6, full 6x6) and merges the reports. -->
<div id="frames"></div>
<pre id="out">waiting</pre>
<script>
const params = new URLSearchParams(location.search);
const w = Number(params.get('w') || 375);
const mode = params.get('mode') || 'script';
const list = params.get('players') ? [params.get('players')] : ['2', '3', '4'];
const frames = list.map((players) => {
    const f = document.createElement('iframe');
    f.title = `harness ${players}`;
    f.width = String(w);
    f.height = '2400';
    f.src = `index.html?players=${players}&mode=${mode}`;
    document.getElementById('frames').appendChild(f);
    return { players, f };
});
const started = Date.now();
const finish = (text) => {
    clearInterval(poll);
    document.getElementById('out').textContent = text;
    document.body.dataset.done = '1';
};
const poll = setInterval(() => {
    const docs = frames.map(({ f }) => { try { return f.contentDocument; } catch (e) { return null; } });
    if (docs.every((doc) => doc && doc.body && doc.body.dataset.done === '1')) {
        const texts = docs.map((doc) => doc.getElementById('out').textContent);
        if (texts.length === 1) return finish(texts[0]);
        const merged = {};
        let bad = null;
        texts.forEach((t, i) => { try { merged[`p${frames[i].players}`] = JSON.parse(t); } catch (e) { bad = t; } });
        finish(bad ? bad.slice(0, 200) : JSON.stringify(merged));
    } else if (Date.now() - started > 20000) {
        finish('timed out');
    }
}, 50);
</script>
</body>
</html>
