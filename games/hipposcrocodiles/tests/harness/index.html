<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hippos & Crocodiles harness</title>
<link rel="stylesheet" href="../../bga/hipposcrocodiles.css">
<style>
  #statusbar { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px; }
  .bgabutton { display: inline-flex; align-items: center; justify-content: center; padding: 0 10px; background: #4871b6; color: #fff; border-radius: 3px; }
  #chat { width: 120px; }
  body { margin: 0; font-family: sans-serif; background: #fff; }
  #game_play_area { padding: 0; }
  #out { white-space: pre-wrap; font: 12px monospace; padding: 8px; }
</style>
</head>
<body data-done="0">
<div id="page-content">
  <div id="statusbar"></div>
  <div id="game_play_area"></div>
</div>
<div id="player_panels"></div>
<input id="chat" placeholder="chat">
<pre id="out">running</pre>

<script>
window._ = (s) => s;
window.g_gamethemeurl = '../../bga/';
window.errors = [];
window.addEventListener('error', (e) => {
  const msg = String(e.message || e);
  if (!msg.includes('ResizeObserver')) window.errors.push(msg);
});
window.addEventListener('unhandledrejection', (e) => {
  const msg = String(e.reason || e);
  if (!msg.includes('ResizeObserver')) window.errors.push(msg);
});
</script>
<script type="module">
import { Game } from '../../bga/modules/js/Game.js';

const calls = [];
const buttons = [];
const bga = {
  states: { register() {} },
  gameArea: { getElement: () => document.getElementById('game_play_area') },
  notifications: { setupPromiseNotifications() {} },
  userPreferences: { get: () => 1 },
  sounds: { play() {} },
  players: {
    getCurrentPlayerId: () => 1,
    isCurrentPlayerActive: () => true,
    getActivePlayerId: () => 1,
    getPlayer: (id) => ({ id, name: id == 1 ? 'Alice' : 'Bob', color: id == 1 ? 'e94190' : '008000' }),
  },
  playerPanels: {
    getElement: (pid) => {
      let el = document.getElementById('panel_' + pid);
      if (!el) {
        el = document.createElement('div');
        el.id = 'panel_' + pid;
        document.getElementById('player_panels').appendChild(el);
      }
      return el;
    },
    getScoreCounter: () => ({ toValue() {} }),
  },
  statusBar: {
    removeActionButtons() { buttons.length = 0; document.getElementById('statusbar').innerHTML = ''; },
    addActionButton(text, callback, opts) {
      buttons.push({ text, callback, opts });
      const b = document.createElement('a');
      b.className = 'bgabutton bgabutton_' + (opts?.color || 'blue') + ' ' + (opts?.classes || '');
      b.textContent = text;
      if (opts?.tooltip) b.title = opts.tooltip;
      b.onclick = callback;
      document.getElementById('statusbar').appendChild(b);
    },
    setTitle(t) { window.__lastTitle = t; },
  },
  actions: {
    performAction(name, args) { calls.push({ name, args }); return Promise.resolve(); },
  },
};

// ?map=1..4 (default 2 Rectangle), ?trunks=none|random|setup
const params = new URLSearchParams(location.search);
const MAP = Number(params.get('map') || 2);
const TRUNKS = params.get('trunks') || 'none';
const masks = await (await fetch('masks.json')).json();
const mask = masks[String(MAP)];

const HIPPO = {
  0: [[0,0],[0,1],[0,2],[1,0],[1,1],[1,2],[1,3],[2,0],[2,1],[2,2]],
  1: [[0,0],[0,1],[0,2],[1,0],[1,1],[1,2],[2,0],[2,1],[2,2],[3,1]],
  2: [[0,1],[0,2],[0,3],[1,0],[1,1],[1,2],[1,3],[2,1],[2,2],[2,3]],
  3: [[0,1],[1,0],[1,1],[1,2],[2,0],[2,1],[2,2],[3,0],[3,1],[3,2]],
};
const TRUNK = { 0: [[0,0],[0,1],[0,2]], 1: [[0,0],[1,0],[2,0]] };
const trunks = TRUNKS === 'random'
  ? [{ id: 1, player_id: 0, rotation: 0, top_r: 2, left_c: 3 }, { id: 2, player_id: 0, rotation: 1, top_r: 6, left_c: 8 },
     { id: 3, player_id: 0, rotation: 0, top_r: 11, left_c: 4 }, { id: 4, player_id: 0, rotation: 1, top_r: 8, left_c: 1 }]
  : [];
const taken = new Set();
for (const t of trunks) for (const [dr, dc] of TRUNK[t.rotation]) taken.add(`${t.top_r + dr},${t.left_c + dc}`);
function legalFor(shapes) {
  const out = [];
  for (const rot of Object.keys(shapes)) {
    for (let r = 0; r < mask.length; r++) for (let c = 0; c < mask[0].length; c++) {
      if (shapes[rot].every(([dr, dc]) => mask[r + dr]?.[c + dc] === '#' && !taken.has(`${r + dr},${c + dc}`))) {
        out.push({ rot: Number(rot), r, c });
      }
    }
  }
  return out;
}

function fixture() {
  return {
    map: MAP,
    mask,
    rows: mask.length,
    cols: mask[0].length,
    easy: true,
    trunk_mode: TRUNKS === 'setup' ? 2 : (TRUNKS === 'random' ? 3 : 1),
    trunks,
    trunks_left: { 1: TRUNKS === 'setup' ? 2 : 0, 2: TRUNKS === 'setup' ? 2 : 0 },
    placed_pieces: [],
    species: { 1: 'hippo', 2: 'crocodile' },
    reserves: { 1: 8, 2: 8 },
  };
}

try {
  const game = new Game(bga);
  game.setup(fixture());

  // Enter turn state with legal placements
  if (TRUNKS === 'setup') {
    game.enterTurn({ species: 'trunk', legal_placements: legalFor(TRUNK), trunks_left: 2 }, true);
  } else {
    game.enterTurn({ species: 'hippo', legal_placements: legalFor(HIPPO), reserve_left: 8 }, true);
  }

  // Simulate tapping a legal cell
  const rot0 = (game.args.legal_placements || []).filter((m) => m.rot === 0);
  const first = rot0[Math.floor(rot0.length / 2)] || { r: 0, c: 0 };
  game.onCellClicked(first.r + (TRUNKS === 'setup' ? 0 : 1), first.c + 1);

  // Chat box that steals letter keys (bubble phase, like BGA's) - our capture listener must win
  const chat = document.getElementById('chat');
  document.addEventListener('keydown', (e) => { if (/^[a-z]$/i.test(e.key)) chat.focus(); });

  // Check that Confirm button appeared
  const hasConfirm = buttons.some(b => b.text && b.text.includes('Confirm'));

  const rotBtns = [...document.querySelectorAll('.hippos_rot_btn')].map((b) => b.getBoundingClientRect());
  const minBtn = Math.round(Math.min(...rotBtns.map((r) => Math.min(r.width, r.height))));
  const touchLabels = buttons.map((b) => b.text).join('|');
  const touchHasTooltip = buttons.some((b) => b.opts?.tooltip);

  // Desktop mode: hover ghost, A/D/S, click places immediately
  const desk = {};
  if (TRUNKS !== 'setup') {
    game.onCancel();
    game.desktopOverride = true;
    game.updateButtons(game.args, true);
    desk.tooltips = buttons.filter((b) => b.opts?.tooltip).map((b) => b.opts.tooltip).join('|');
    game.currentRot = 0;
    const pm = game.legalIn(0)[Math.floor(game.legalIn(0).length / 2)];
    const [pr, pc] = game.pivotOf(pm, 0);
    document.getElementById(`hippos_cell_${pr}_${pc}`).dispatchEvent(new MouseEvent('mouseenter'));
    desk.hoverGhost = document.querySelectorAll('.hippos_ghost_hover').length;
    const key = (k) => document.body.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true }));
    chat.blur();
    key('d'); desk.afterD = game.currentRot;
    key('a'); key('a'); desk.afterA = game.currentRot;
    key('s'); desk.afterS = game.currentRot;
    desk.chatFocused = document.activeElement === chat;
    desk.ghostAfterKeys = document.querySelectorAll('.hippos_ghost_hover').length;
    // typing in the chat itself must be left alone
    const ev = new KeyboardEvent('keydown', { key: 'd', bubbles: true, cancelable: true });
    chat.dispatchEvent(ev); desk.chatKeyUntouched = !ev.defaultPrevented && game.currentRot === desk.afterS;
    if (params.get('shot') === 'desktop') {
      game.currentRot = 0; game.highlightLegal();
      const m2 = game.legalIn(0)[Math.floor(game.legalIn(0).length / 2)];
      const [qr, qc] = game.pivotOf(m2, 0);
      document.getElementById(`hippos_cell_${qr}_${qc}`).dispatchEvent(new MouseEvent('mouseenter'));
    } else {
      // Preference 102 "Confirm placement" on (default): the click only stages, Confirm places
      calls.length = 0;
      const m3 = game.legalIn(game.currentRot)[0];
      const [tr, tc] = game.pivotOf(m3, game.currentRot);
      game.onCellClicked(tr, tc);
      desk.clickStaged = calls.length === 0 && !!game.stage;
      game.onConfirm();
      desk.confirmPlaced = calls.length === 1 && calls[0].name === 'actPlace';
      // Preference off: the click places at once
      const prefGet = game.bga.userPreferences.get;
      game.bga.userPreferences.get = (id) => (id === 102 ? 0 : 1);
      calls.length = 0; game.stage = null;
      game.onCellClicked(tr, tc);
      desk.clickPlaced = desk.clickStaged && desk.confirmPlaced && calls.length === 1 && calls[0].name === 'actPlace';
      game.bga.userPreferences.get = prefGet;
    }
    if (params.get('shot') === 'phone') {
      game.desktopOverride = false; game.hover = null; game.clearHoverGhost(); game.currentRot = 0;
      game.onCellClicked(pr, pc); // staged ghost + Confirm/Cancel
    }
    if (params.get('shot') !== 'desktop') {
      // Staged on desktop: A/S/D rotate only the hover ghost
      game.bga.userPreferences.get = () => 1;
      game.stage = null; game.currentRot = 0; game.highlightLegal();
      const ms = game.legalIn(0)[0];
      const [sr, sc] = game.pivotOf(ms, 0);
      const cellS = document.getElementById(`hippos_cell_${sr}_${sc}`);
      cellS.dispatchEvent(new MouseEvent('mouseenter'));
      game.onCellClicked(sr, sc);
      const before = JSON.stringify(game.stage);
      const stagedGhostBefore = document.querySelector('.hippos_ghost')?.className;
      const rotBefore = game.currentRot;
      key('d');
      desk.stageKept = !!game.stage && JSON.stringify(game.stage) === before && game.stage.rot === 0;
      desk.hoverRotChanged = game.currentRot !== rotBefore && game.currentRot === 1;
      desk.stagedGhostKept = document.querySelectorAll('.hippos_ghost').length === 1
        && document.querySelector('.hippos_ghost')?.className === stagedGhostBefore;
      // Hint preference
      desk.noLegalTarget = document.querySelectorAll('.hippos_legal_target').length === 0;
      desk.pivotHints = document.querySelectorAll('.hippos_pivot_target').length > 0;
      desk.easyText = TRUNKS === 'setup' ? /horizontal \d+, vertical \d+/.test(window.__lastTitle || '')
        : /Possible spots: /.test(window.__lastTitle || '') && ((window.__lastTitle || '').match(/hippos_title_icon/g) || []).length === 5; // big picture + 4 half-size direction pictures
      game.easy = false; game.highlightLegal(); game.updateTitle();
      desk.hintsOff = document.querySelectorAll('.hippos_pivot_target').length === 0
        && document.querySelectorAll('.hippos_legal_target').length === 0
        && /^You must place a \w+ /.test(window.__lastTitle) && !/Possible|\d spots/.test(window.__lastTitle.replace(/<[^>]*>/g, '').replace(/\d+px/g, ''));
      game.hover = null; game.onCellClicked(0, 0);
      desk.hardNoFit = true;
      game.easy = true; game.highlightLegal(); game.updateTitle();
      desk.hintsBack = document.querySelectorAll('.hippos_pivot_target').length > 0;
      // Button order
      game.updateButtons(game.args, true);
      const order = buttons.map((b) => b.text.replace(/<[^>]*>/g, '').trim());
      const iL = order.findIndex((t) => /Left/.test(t)), i180 = order.findIndex((t) => /180/.test(t)), iR = order.findIndex((t) => /Right/.test(t));
      desk.order = order.join('|');
      desk.orderOk = game.args.species === 'trunk' || (iL >= 0 && iL < i180 && i180 < iR);
      // Touch: rotation buttons still rotate the staged animal
      game.desktopOverride = false; game.hover = null; game.clearHoverGhost();
      game.currentRot = 0; game.onCellClicked(sr, sc);
      game.onRotate(1);
      desk.touchRotatesStage = !game.stage || game.stage.rot === 1;
      game.desktopOverride = true;
    }
    desk.extra = desk.stageKept !== false && desk.hoverRotChanged !== false && desk.stagedGhostKept !== false
      && desk.noLegalTarget !== false && desk.pivotHints !== false && desk.hintsOff !== false && desk.easyText !== false && desk.hintsBack !== false
      && desk.orderOk !== false && desk.touchRotatesStage !== false;
    desk.ok = desk.extra && desk.hoverGhost === 1 && desk.afterD === 1 && desk.afterA === 3 && desk.afterS === 1 && !desk.chatFocused
      && desk.ghostAfterKeys === 1 && desk.chatKeyUntouched && (params.get('shot') === 'desktop' || desk.clickPlaced)
      && /A/.test(desk.tooltips) && /S/.test(desk.tooltips) && !touchHasTooltip;
  }

  // Measure layout
  setTimeout(() => {
    const board = document.getElementById('hippos_board');
    const boardRect = board ? board.getBoundingClientRect() : { width: 0 };
    const vp = window.innerWidth;
    const horizontalOverflow = Math.max(0, document.documentElement.scrollWidth - vp);

    // Measure tap cell size
    const firstCell = document.querySelector('.hippos_cell');
    const cellRect = firstCell ? firstCell.getBoundingClientRect() : { width: 0, height: 0 };
    const cellPx = Math.round(Math.min(cellRect.width, cellRect.height));

    const report = {
      viewport: vp,
      boardWidth: Math.round(boardRect.width),
      cellPx: cellPx,
      hasConfirmButton: hasConfirm,
      horizontalOverflow: Math.round(horizontalOverflow),
      jsErrors: window.errors,
      minRotButtonPx: minBtn,
      desktop: desk,
      ok: window.errors.length === 0 && minBtn >= 44 && (desk.ok !== false) && horizontalOverflow === 0 && cellPx >= 32 && hasConfirm,
    };

    document.getElementById('out').textContent = JSON.stringify(report, null, 2);
    document.body.dataset.done = '1';
    if (params.get('shot')) window.scrollTo(0, 0);
  }, 200);

} catch (err) {
  window.errors.push(err.stack || err.message);
  document.getElementById('out').textContent = JSON.stringify({ ok: false, error: String(err) }, null, 2);
  document.body.dataset.done = '1';
}
</script>
</body>
</html>
