<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sugar Gliders harness</title>
<link rel="stylesheet" href="../../bga/sugargliders.css">
<style>
  body { margin: 0; font-family: sans-serif; background: transparent; }
  #game_play_area { padding: 0; }
  #out { white-space: pre-wrap; font: 12px monospace; padding: 8px; }
</style>
</head>
<body data-done="0">
<div id="page-content">
  <div id="statusbar"></div>
  <div id="game_play_area"></div>
</div>
<div id="player_panels"></div>
<pre id="out">running</pre>

<script>
window._ = (s) => s;
window.g_gamethemeurl = '../../bga/';
window.errors = [];
window.addEventListener('error', (e) => {
  const msg = String(e.message || e);
  if (!msg.includes('ResizeObserver')) window.errors.push(msg);
});
window.addEventListener('unhandledrejection', (e) => {
  const msg = String(e.reason || e);
  if (!msg.includes('ResizeObserver')) window.errors.push(msg);
});
</script>
<script type="module">
import { Game } from '../../bga/modules/js/Game.js';

const calls = [];
const buttons = [];
let turnState = null;
let setupState = null;

const bga = {
  states: {
    register(name, handler) {
      if (name === 'PlayerTurn') turnState = handler;
      if (name === 'SetupPlacement') setupState = handler;
    }
  },
  gameArea: { getElement: () => document.getElementById('game_play_area') },
  notifications: { setupPromiseNotifications() {} },
  userPreferences: { get: (id) => (id === 102 ? Number(QP.get('cb') || 0) : id === 103 ? Number(QP.get('gl') || 1) : 1) },
  statusBar: {
    setTitle() {},
    addActionButton(text, callback, opts) {
      buttons.push({ text, callback, opts: opts || {} });
    },
    removeActionButtons() { buttons.length = 0; },
  },
  players: {
    getCurrentPlayerId: () => 1,
    isCurrentPlayerActive: () => true,
    getActivePlayerId: () => 1,
  },
  playerPanels: {
    getElement: (pid) => {
      let el = document.getElementById('panel_' + pid);
      if (!el) {
        el = document.createElement('div');
        el.id = 'panel_' + pid;
        document.getElementById('player_panels').appendChild(el);
      }
      return el;
    },
    getScoreCounter: () => ({ toValue() {} }),
  },
  actions: {
    performAction(name, args) { calls.push({ name, args }); return Promise.resolve(); },
  },
};

const QP = new URLSearchParams(location.search);
function fixture() {
  const board_tiles = {};
  const HEX_RADIUS = Number(QP.get('radius') || 4);
  const NP = Number(QP.get('players') || 2);
  let id = 1;
  for (let q = -HEX_RADIUS; q <= HEX_RADIUS; q++) {
    const r1 = Math.max(-HEX_RADIUS, -q - HEX_RADIUS);
    const r2 = Math.min(HEX_RADIUS, -q + HEX_RADIUS);
    for (let r = r1; r <= r2; r++) {
      board_tiles[`${q}_${r}`] = { tile_id: id, value: (id % 4) + 1, q, r };
      id++;
    }
  }
  const cols = ['ff0000', '0000ff', 'ffd700', '008000'];
  const gl = [[0, 0], [1, -1], [-2, 1], [2, 0]];
  const players = {}, player_colors = {}, gliders = {}, player_reserves = {}, jumping_tiles = {}, scores = {};
  for (let i = 1; i <= NP; i++) {
    players[i] = { id: i, name: 'Player' + i, color: cols[i - 1] };
    player_colors[i] = ['red', 'blue', 'yellow', 'green'][i - 1];
    gliders[i] = { player_id: i, q: gl[i - 1][0], r: gl[i - 1][1], in_torpor: QP.get('asleep') === '1' };
    player_reserves[i] = [{ tile_id: 900 + i, value: 2 }, { tile_id: 910 + i, value: 4 }];
    jumping_tiles[i] = { tile_id: 950 + i, value: 3 };
    scores[i] = 6;
  }
  delete board_tiles['0_0'];
  return {
    players, player_colors, hex_radius: HEX_RADIUS, game_mode: 1, total_tiles: 37, turn_count: 1, consecutive_torpor: 0,
    gliders, player_reserves, jumping_tiles, scores,
    board_tiles,
  };
}

try {
  const game = new Game(bga);
  game.setup(fixture());

  if (turnState) {
    turnState.onEnteringState({
      legal_jumps: [{ target_q: 0, target_r: 1 }],
      jumping_tile: { tile_id: 1, value: 1 },
      reserve_tiles: [],
      can_torpor: true,
      has_valid_moves: true,
      will_end_on_torpor: false,
    }, true);
  }

  // End-of-game check: BGA's end panel buttons ("N tables are waiting", "Back to main page") must stay clickable.
  // Simulates the last jump (with an animation that never finishes, as in a background tab), the final scoring
  // notifications and the game end, then puts a mock end-panel button where BGA draws it.
  async function endOfGame() {
    const res = { ok: true, problems: [] };
    const fail = (m) => { res.ok = false; res.problems.push(m); };
    const realAnimate = Element.prototype.animate;
    const t0 = performance.now();
    try {
      // a frozen animation (never finishes) must not freeze the notification promise
      Element.prototype.animate = function () { return { onfinish: null, oncancel: null, cancel() {} }; };
      const p = game.notif_sugarGliderJumped({ args: { player_id: 1, from_q: 0, from_r: 1, to_q: 1, to_r: 1,
        collected_tile: { tile_id: 777, value: 2 }, new_jumping_tile: { tile_id: 778, value: 2 }, current_score: 8 } });
      const winner = await Promise.race([p.then(() => 'resolved'), new Promise(r => setTimeout(() => r('stuck'), 4000))]);
      if (winner !== 'resolved') fail('jump notification promise never resolved (would freeze the BGA notification queue)');
      Element.prototype.animate = realAnimate;
      res.promiseMs = Math.round(performance.now() - t0);

      // leave the turn state, then the final scoring notifications
      if (turnState) turnState.onLeavingState();
      game.notif_finalCollect({ args: { player_id: 1, collected_tile: { tile_id: 778, value: 2 }, current_score: 10 } });
      for (const id of Object.keys(game.gamedatas.players)) game.notif_finalScore({ args: { player_id: Number(id), score: 10 } });
      game.notif_endGameScores({ args: { winner_ids: [1], player_name: 'Player1', score: 10, scores: { 1: 10 } } });
      if (buttons.length) fail('stale action buttons were re-added after the turn ended: ' + buttons.map(b => b.text).join(', '));
      if (document.querySelector('.sg-hex-cell.selectable')) fail('stale highlights left after the turn ended');
    } catch (e) {
      Element.prototype.animate = realAnimate;
      fail('exception at game end: ' + (e.stack || e));
    }
    // mock of BGA's end-of-game panel: one block under the play area, one fixed at the top like the page header
    const panel = document.createElement('div');
    panel.id = 'mock_end_panel';
    panel.innerHTML = '<button id="mock_next_table" style="width:220px;height:40px">659 tables are waiting for me</button> <button id="mock_main" style="width:160px;height:40px">Back to main page</button>';
    document.getElementById('page-content').appendChild(panel);
    const top = document.createElement('button');
    top.id = 'mock_top_btn'; top.textContent = 'top'; top.style.cssText = 'position:fixed;top:4px;right:4px;width:80px;height:40px;z-index:10';
    document.body.appendChild(top);
    let clicks = 0;
    for (const id of ['mock_next_table', 'mock_main', 'mock_top_btn']) {
      const b = document.getElementById(id);
      b.addEventListener('click', () => { clicks++; });
      b.scrollIntoView({ block: 'center' });
      const r = b.getBoundingClientRect();
      const hit = document.elementFromPoint(r.left + r.width / 2, r.top + r.height / 2);
      if (hit !== b) fail(id + ' is covered by ' + (hit ? (hit.id || hit.tagName + '.' + hit.className) : 'nothing'));
      b.click();
    }
    if (clicks !== 3) fail('end-panel buttons did not receive clicks');
    return res;
  }

  setTimeout(async () => {
    const gameEnd = QP.get('noend') ? { ok: true, skipped: true } : await endOfGame();
    const board = document.getElementById('sg_container') || document.getElementById('sg_board_svg');
    const boardRect = board ? board.getBoundingClientRect() : { width: 0 };
    const vp = window.innerWidth;
    const horizontalOverflow = Math.max(0, document.documentElement.scrollWidth - vp);

    // Measure cell tap target size
    let minCell = 999;
    document.querySelectorAll('.sg-hex-cell').forEach(c => {
      const r = c.getBoundingClientRect();
      const s = Math.min(r.width, r.height);
      if (s > 0 && s < minCell) minCell = s;
    });

    const report = {
      viewport: vp,
      boardWidth: Math.round(boardRect.width),
      horizontalOverflow: Math.round(horizontalOverflow),
      cellTargetMin: minCell === 999 ? 0 : Math.round(minCell),
      jsErrors: window.errors,
      gameEnd,
      ok: gameEnd.ok && window.errors.length === 0 && horizontalOverflow === 0 && minCell >= 32,
    };

    document.getElementById('out').textContent = JSON.stringify(report, null, 2);
    document.body.dataset.done = '1';
  }, 250);

} catch (err) {
  window.errors.push(err.stack || err.message);
  document.getElementById('out').textContent = JSON.stringify({ ok: false, error: String(err.stack || err) }, null, 2);
  document.body.dataset.done = '1';
}
</script>
</body>
</html>
