name: Studio E2E

# Plays real BGA Studio tables in a headless browser (tools/e2e/studio_play.py).
# Runs after a successful "BGA Studio Deployer" for the games that push changed, nightly for all enabled games
# (tools/e2e/games.json), or by hand. Needs the repo secret BGA_STUDIO_PASSWORD (optional: BGA_STUDIO_USERNAME).
# A failure opens or updates one issue per game, labelled e2e-failure, with the step, error text and run link.
on:
  workflow_run:
    workflows: ["BGA Studio Deployer"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      game:
        description: 'Game slug, or "all" for every enabled game'
        required: true
        default: 'all'

# The Studio test accounts are shared: never run two tables at once.
concurrency:
  group: bga-studio-e2e
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  e2e:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BGA_STUDIO_PASSWORD: ${{ secrets.BGA_STUDIO_PASSWORD }}
      BGA_STUDIO_USERNAME: ${{ secrets.BGA_STUDIO_USERNAME }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Pick games
        id: pick
        run: |
          enabled=$(python3 -c "import json;print(' '.join(json.load(open('tools/e2e/games.json'))['enabled']))")
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            # games touched by the pushed commit(s); the nightly run covers anything this misses
            changed=$(git diff --name-only HEAD~1 HEAD | awk -F/ '$1=="games"{print $2}' | sort -u)
            games=""
            for g in $enabled; do echo "$changed" | grep -qx "$g" && games="$games $g"; done
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.game }}" != "all" ]; then
            games="${{ github.event.inputs.game }}"
          else
            games="$enabled"
          fi
          echo "games=$(echo $games)" >> "$GITHUB_OUTPUT"
          echo "Games to test: $games"

      - name: Check secret
        id: secret
        if: steps.pick.outputs.games != ''
        run: |
          if [ -z "$BGA_STUDIO_PASSWORD" ]; then
            echo "::warning::Secret BGA_STUDIO_PASSWORD is not set, so the E2E tests were skipped. Settings > Secrets and variables > Actions."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.secret.outputs.ready == 'true'
        with:
          python-version: '3.11'

      - name: Install Playwright
        if: steps.secret.outputs.ready == 'true'
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Play the games
        id: play
        if: steps.secret.outputs.ready == 'true'
        run: |
          failed=""
          for g in ${{ steps.pick.outputs.games }}; do
            for p in 2 max; do
              python3 tools/e2e/studio_play.py "$g" --players "$p" || failed="$failed $g"
            done
          done
          echo "failed=$(echo $failed | tr ' ' '\n' | sort -u | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Upload screenshots and reports
        if: always() && steps.secret.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ github.run_id }}
          path: tools/e2e/out/
          retention-days: 30

      - name: Open or update failure issues
        if: always() && steps.secret.outputs.ready == 'true'
        run: |
          gh label create e2e-failure --color B60205 --description "Studio end-to-end test failed" 2>/dev/null || true
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          for dir in tools/e2e/out/*/; do
            [ -f "$dir/report.json" ] || continue
            overall=$(python3 -c "import json,sys;print(json.load(open('$dir/report.json'))['overall'])")
            [ "$overall" = "fail" ] || continue
            game=$(python3 -c "import json;print(json.load(open('$dir/report.json'))['game'])")
            title="E2E failure: $game"
            { cat "$dir/report.md"; echo; echo "Run: $run_url"; echo "Screenshots and DOM dumps: artifact \`e2e-${{ github.run_id }}\` on that run."; } > /tmp/body.md
            number=$(gh issue list --label e2e-failure --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
            if [ -n "$number" ]; then gh issue comment "$number" --body-file /tmp/body.md
            else gh issue create --title "$title" --label e2e-failure --body-file /tmp/body.md; fi
          done

      - name: Fail the run if a game failed
        if: steps.play.outputs.failed != ''
        run: |
          echo "::error::E2E failed for: ${{ steps.play.outputs.failed }}"
          exit 1
