name: Studio E2E

# Plays real BGA Studio tables in a headless browser (tools/e2e/studio_play.py).
# Runs after a successful "BGA Studio Deployer" for the games that push changed, nightly for all enabled games
# (tools/e2e/games.json), or by hand. Needs the repo secret BGA_STUDIO_PASSWORD (optional: BGA_STUDIO_USERNAME).
# A failure opens or updates one issue per game, labelled e2e-failure, with the step, error text and run link.
on:
  workflow_run:
    workflows: ["BGA Studio Deployer"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      game:
        description: 'Game slug, or "all" for every enabled game'
        required: true
        default: 'all'
      probe:
        description: 'Probe only: log in, open one table, dump the page structure (no assertions, no issues)'
        type: boolean
        default: false

# The Studio test accounts are shared: never run two tables at once.
concurrency:
  group: bga-studio-e2e
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  e2e:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      BGA_STUDIO_PASSWORD: ${{ secrets.BGA_STUDIO_PASSWORD }}
      BGA_STUDIO_USERNAME: ${{ secrets.BGA_STUDIO_USERNAME }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Pick games
        id: pick
        run: |
          enabled=$(python3 -c "import json;print(' '.join(json.load(open('tools/e2e/games.json'))['enabled']))")
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            # games touched by the pushed commit(s); the nightly run covers anything this misses
            changed=$(git diff --name-only HEAD~1 HEAD | awk -F/ '$1=="games"{print $2}' | sort -u)
            games=""
            for g in $enabled; do echo "$changed" | grep -qxi "$g" && games="$games $g"; done
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.game }}" != "all" ]; then
            games="${{ github.event.inputs.game }}"
          else
            games="$enabled"
          fi
          echo "games=$(echo $games)" >> "$GITHUB_OUTPUT"
          echo "Games to test: $games"

      - name: Check secret
        id: secret
        if: steps.pick.outputs.games != ''
        run: |
          if [ -z "$BGA_STUDIO_PASSWORD" ]; then
            echo "::warning::Secret BGA_STUDIO_PASSWORD is not set, so the E2E tests were skipped. Settings > Secrets and variables > Actions."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.secret.outputs.ready == 'true'
        with:
          python-version: '3.11'

      - name: Install Playwright
        if: steps.secret.outputs.ready == 'true'
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Probe the Studio page structure
        if: steps.secret.outputs.ready == 'true' && github.event.inputs.probe == 'true'
        run: |
          for g in ${{ steps.pick.outputs.games }}; do python3 tools/e2e/studio_play.py "$g" --probe --players 2 || true; break; done

      - name: Play the games
        id: play
        if: steps.secret.outputs.ready == 'true' && github.event.inputs.probe != 'true'
        run: |
          failed=""
          for g in ${{ steps.pick.outputs.games }}; do
            max=$(python3 -c "import sys; sys.path.insert(0,'tools/e2e'); import studio_play; print(studio_play.game_players('$g')[1])")
            counts="2"; [ "$max" != "2" ] && counts="2 max"
            for p in $counts; do
              python3 tools/e2e/studio_play.py "$g" --players "$p" || failed="$failed $g"
            done
          done
          echo "failed=$(echo $failed | xargs -n1 2>/dev/null | sort -u | xargs)" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always() && steps.secret.outputs.ready == 'true'
        run: |
          for f in tools/e2e/out/*/report.md; do [ -f "$f" ] && { cat "$f"; echo; } >> "$GITHUB_STEP_SUMMARY"; done || true

      - name: Upload screenshots and reports
        if: always() && steps.secret.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ github.run_id }}
          path: tools/e2e/out/
          retention-days: 30

      - name: Open or update failure issues
        if: always() && steps.secret.outputs.ready == 'true' && github.event.inputs.probe != 'true'
        run: |
          gh label create e2e-failure --color B60205 --description "Studio end-to-end test failed" 2>/dev/null || true
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          for game in $(ls tools/e2e/out 2>/dev/null | sed 's/-[0-9]*p$//' | sort -u); do
            failed=false
            : > /tmp/body.md
            for dir in tools/e2e/out/$game-*p; do
              [ -f "$dir/report.json" ] || continue
              [ "$(python3 -c "import json;print(json.load(open('$dir/report.json'))['overall'])")" = "fail" ] && failed=true
              cat "$dir/report.md" >> /tmp/body.md; echo >> /tmp/body.md
            done
            title="E2E failure: $game"
            number=$(gh issue list --label e2e-failure --state open --json number,title --jq "[.[]|select(.title==\"$title\")][0].number")
            if ! $failed; then
              if [ -n "$number" ] && [ "$number" != "null" ]; then
                gh issue comment "$number" --body "Passing again in $run_url" && gh issue close "$number"
              fi
              continue
            fi
            { echo "Run: $run_url"; echo "Screenshots and DOM dumps: artifact \`e2e-${{ github.run_id }}\` on that run."; } >> /tmp/body.md
            if [ -n "$number" ] && [ "$number" != "null" ]; then gh issue comment "$number" --body-file /tmp/body.md
            else gh issue create --title "$title" --label e2e-failure --body-file /tmp/body.md; fi
          done

      - name: Fail the run if a game failed
        if: steps.play.outputs.failed != ''
        run: |
          echo "::error::E2E failed for: ${{ steps.play.outputs.failed }}"
          exit 1
