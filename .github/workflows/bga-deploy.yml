name: BGA Studio Deployer

on:
  push:
    branches: [ main ]
    paths:
      - 'games/**'
      - 'tools/**'
  workflow_dispatch:
    inputs:
      target:
        description: 'Game target to deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - omega
          - omegatest
          - yavalath
          - lordsofscotland
          - pushfight
          - mandala
          - kiln
          - sugargliders
          - gardensofuranus
          - nestorgamesgp
          - microforge

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install paramiko

      - name: Deploy to BGA Studio
        env:
          BGA_SFTP_HOST: "1.studio.boardgamearena.com"
          BGA_SFTP_PORT: "2022"
          BGA_SFTP_USERNAME: ${{ secrets.BGA_SFTP_USERNAME || 'JayadevHaddadi' }}
          BGA_SFTP_PASSWORD: ${{ secrets.BGA_SFTP_PASSWORD }}
        run: |
          if [ -z "$BGA_SFTP_PASSWORD" ]; then
            echo "::error::Secret BGA_SFTP_PASSWORD is not set in GitHub repository settings!"
            echo "Please go to Settings -> Secrets and variables -> Actions and add BGA_SFTP_PASSWORD."
            exit 1
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHOICE="${{ github.event.inputs.target }}"
            if [ "$CHOICE" = "all" ]; then
              python tools/sync.py omega
              python tools/sync.py yavalath
              python tools/sync.py lordsofscotland
              python tools/sync.py pushfight
              python tools/sync.py mandala
            else
              python tools/sync.py "$CHOICE"
            fi
          else
            # Triggered by push to main: detect which game changed
            CHANGED=$(git diff --name-only HEAD~1 HEAD || echo "all")
            echo "Changed files:"
            echo "$CHANGED"

            DEPLOYED=0
            if echo "$CHANGED" | grep -q "games/omega"; then
              echo "Deploying Omega to official slot (omega)..."
              python tools/sync.py omega
              DEPLOYED=1
            fi

            if echo "$CHANGED" | grep -q "games/yavalath"; then
              echo "Deploying Yavalath..."
              python tools/sync.py yavalath
              DEPLOYED=1
            fi

            if echo "$CHANGED" | grep -q "games/lordsofscotland"; then
              echo "Deploying Lords of Scotland..."
              python tools/sync.py lordsofscotland --force
              DEPLOYED=1
            fi

            if echo "$CHANGED" | grep -q "games/pushfight"; then
              echo "Deploying Push Fight..."
              python tools/sync.py pushfight
              DEPLOYED=1
            fi

            if echo "$CHANGED" | grep -q "games/mandala"; then
              echo "Deploying Mandala..."
              python tools/sync.py mandala
              DEPLOYED=1
            fi

            if echo "$CHANGED" | grep -qi "games/kiln"; then
              echo "Deploying Kiln..."
              python tools/sync.py kiln
              DEPLOYED=1
            fi

            if echo "$CHANGED" | grep -qi "games/sugargliders"; then
              echo "Deploying Sugar Gliders..."
              python tools/sync.py sugargliders
              DEPLOYED=1
            fi

            if echo "$CHANGED" | grep -qi "games/gardensofuranus"; then
              echo "Deploying Gardens of Uranus..."
              python tools/sync.py gardensofuranus
              DEPLOYED=1
            fi

            if echo "$CHANGED" | grep -qi "games/nestorgamesgp"; then
              echo "Deploying nestorgames GP..."
              python tools/sync.py nestorgamesgp
              DEPLOYED=1
            fi

            if echo "$CHANGED" | grep -qi "games/microforge"; then
              echo "Deploying MicroForge..."
              python tools/sync.py microforge
              DEPLOYED=1
            fi

            if [ "$DEPLOYED" -eq 0 ]; then
              echo "No specific game folder modified. Deploying active test games..."
              python tools/sync.py omega
              python tools/sync.py yavalath
              python tools/sync.py lordsofscotland
            fi
          fi
