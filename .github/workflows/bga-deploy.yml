name: BGA Studio Deployer

on:
  push:
    branches: [ main ]
    paths:
      - 'games/**'
      - 'tools/**'
  workflow_dispatch:
    inputs:
      target:
        description: 'Game target to deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - omega
          - omegatest
          - yavalath
          - lordsofscotland
          - pushfight
          - mandala
          - kiln
          - sugargliders
          - gardensofuranus
          - gardensofmars
          - gardensofio
          - nestorgamesgp
          - microforge
          - gardensofenceladus
          - microchip
          - people
          - red
          - hipposcrocodiles
          - pentup
          - vaultnestorgames
          - feedtheducks
          # <bga:options>  (tools/bga.py register inserts new games above this line)

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Full history: a push can hold several commits, and every game they touch must deploy
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install paramiko

      - name: Deploy to BGA Studio
        env:
          BGA_SFTP_HOST: "1.studio.boardgamearena.com"
          BGA_SFTP_PORT: "2022"
          BGA_SFTP_USERNAME: ${{ secrets.BGA_SFTP_USERNAME || 'JayadevHaddadi' }}
          BGA_SFTP_PASSWORD: ${{ secrets.BGA_SFTP_PASSWORD }}
          # SSH key (BGA disables SFTP passwords after the Oct 2026 Studio breach). Preferred when set.
          BGA_SFTP_PRIVATE_KEY: ${{ secrets.BGA_SFTP_PRIVATE_KEY }}
        run: |
          if [ -z "$BGA_SFTP_PRIVATE_KEY" ] && [ -z "$BGA_SFTP_PASSWORD" ]; then
            echo "::error::Neither BGA_SFTP_PRIVATE_KEY nor BGA_SFTP_PASSWORD is set in GitHub repository secrets!"
            echo "Add BGA_SFTP_PRIVATE_KEY (contents of ~/.ssh/bga_studio_ed25519) under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python tools/sync.py "${{ github.event.inputs.target }}"
          else
            # Every game folder changed anywhere in the pushed commits (merge commits included).
            # The mapping from folder to Studio project is TARGET_MAP in tools/sync.py.
            python tools/sync.py --changed "${{ github.event.before }}" "${{ github.sha }}"
          fi
